name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Migrations, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spont
          POSTGRES_PASSWORD: spont
          POSTGRES_DB: spont_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spont -d spont_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://spont:spont@localhost:5432/spont_test
      SESSION_SECRET: disposable-ci-session-secret-not-for-deployment
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply migrations to disposable Postgres
        run: npm run db:deploy
      - name: Run all tests
        run: npm test
      - name: Build and check frontend
        run: npm run build
